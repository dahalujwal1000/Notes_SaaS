<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password</title>
<link rel="stylesheet" href="style.css?v=20260830d">
</head>
<body>
<section class="auth-view">
  <div class="auth-card">
    <div class="auth-logo">🔐</div>
    <h1 id="result-title">Reset your password</h1>
    <p id="result-text" class="auth-sub">Choose a new password for your account.</p>
    <form id="reset-form" class="auth-form" autocomplete="on">
      <label class="field">
        <span>New password</span>
        <input type="password" id="reset-password" required minlength="8" maxlength="128" placeholder="At least 8 characters" autocomplete="new-password">
      </label>
      <label class="field">
        <span>Confirm password</span>
        <input type="password" id="reset-confirm" required minlength="8" maxlength="128" placeholder="Repeat the password" autocomplete="new-password">
      </label>
      <p id="result-error" class="auth-error" role="alert" hidden></p>
      <button type="submit" id="reset-submit" class="btn btn-primary btn-block">Set new password</button>
    </form>
    <p class="auth-switch">
      <a href="/" class="btn-link">Back to sign in</a>
    </p>
  </div>
</section>
<script>
(function () {
  var form = document.getElementById("reset-form");
  var password = document.getElementById("reset-password");
  var confirm = document.getElementById("reset-confirm");
  var error = document.getElementById("result-error");
  var submit = document.getElementById("reset-submit");
  var title = document.getElementById("result-title");
  var text = document.getElementById("result-text");
  var token = new URLSearchParams(window.location.search).get("token");

  if (!token) {
    title.textContent = "Missing link";
    text.textContent = "This reset link is incomplete. Please use the full link from your email.";
    form.hidden = true;
    return;
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    error.hidden = true;
    if (password.value !== confirm.value) {
      error.textContent = "Passwords don't match.";
      error.hidden = false;
      return;
    }
    submit.disabled = true;
    fetch("/auth/reset-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token, password: password.value })
    })
      .then(function (resp) { return resp.json().then(function (data) { return { ok: resp.ok, data: data }; }); })
      .then(function (result) {
        if (!result.ok) {
          var detail = (result.data && result.data.detail) || "Could not reset the password.";
          error.textContent = detail;
          error.hidden = false;
        } else {
          title.textContent = "Password updated 🎉";
          text.textContent = "You can now sign in with your new password.";
          form.hidden = true;
        }
      })
      .catch(function () {
        error.textContent = "Something went wrong. Please try again.";
        error.hidden = false;
      })
      .finally(function () { submit.disabled = false; });
  });
})();
</script>
</body>
</html>
