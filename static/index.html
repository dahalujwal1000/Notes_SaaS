<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace — Tasks & Notes</title>
<link rel="stylesheet" href="style.css?v=20260830d">
</head>
<body>

<!-- ================= Auth view ================= -->
<section id="auth-view" class="auth-view" hidden>
  <div class="auth-card">
    <div class="auth-logo">🟣</div>
    <h1 id="auth-title">Welcome back</h1>
    <p class="auth-sub" id="auth-sub">Sign in to your workspace.</p>
    <a href="/auth/google/login" id="google-btn" class="btn btn-google btn-block" role="button">
      <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </a>
    <div class="or-divider"><span>or</span></div>
    <form id="auth-form" autocomplete="on">
      <label class="field">
        <span>Email</span>
        <input type="email" id="auth-email" required placeholder="you@example.com" maxlength="255">
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" id="auth-password" required minlength="8" placeholder="••••••••" maxlength="128">
      </label>
      <p class="field-hint-row">
        <button type="button" id="forgot-password-btn" class="btn-link">Forgot password?</button>
      </p>
      <p id="auth-error" class="auth-error" role="alert" hidden></p>
      <p id="auth-resend-line" class="auth-hint" hidden>
        Didn't get the verification email?
        <button type="button" id="auth-resend-btn" class="btn-link">Resend link</button>
      </p>
      <button type="submit" id="auth-submit" class="btn btn-primary btn-block">Sign in</button>
    </form>

    <form id="forgot-form" class="auth-form" hidden>
      <label class="field">
        <span>Email</span>
        <input type="email" id="forgot-email" required placeholder="you@example.com" maxlength="255">
      </label>
      <p id="forgot-error" class="auth-error" role="alert" hidden></p>
      <button type="submit" id="forgot-submit" class="btn btn-primary btn-block">Send reset link</button>
      <p class="auth-switch">
        <button type="button" id="forgot-back-btn" class="btn-link">Back to sign in</button>
      </p>
    </form>

    <p class="auth-switch" id="auth-switch">
      <span id="auth-switch-text">New here?</span>
      <button type="button" id="auth-switch-btn" class="btn-link">Create an account</button>
    </p>
  </div>
</section>

<!-- ================= App view ================= -->
<div id="app-view" class="app" hidden>

  <aside class="sidebar" id="sidebar">
    <header class="ws-head">
      <span class="ws-avatar">🟪</span>
      <div class="ws-names">
        <strong>My Workspace</strong>
        <span class="ws-plan">Free plan</span>
      </div>
      <button id="collapse-btn" class="btn-icon" type="button" title="Collapse sidebar">«</button>
    </header>

    <div class="tab-row" role="tablist">
      <button class="tab active" data-view="home" type="button">Home</button>
      <button class="tab" data-view="notes" type="button">Notes</button>
    </div>

    <nav class="side-scroll">
      <section class="side-group open">
        <div class="group-head-row">
          <button class="group-head" type="button"><span class="gh-icon">📅</span><span>Upcoming events</span><i class="chev">▾</i></button>
          <button id="add-event-btn" class="btn-icon add-event-btn" type="button" title="Add event">+</button>
        </div>
        <div class="group-body">
          <div id="event-list"></div>
        </div>
      </section>

      <section class="side-group open">
        <button class="group-head" type="button"><span class="gh-icon">👥</span><span>Teamspaces</span><i class="chev">▾</i></button>
        <div class="group-body">
          <button class="side-item" data-view="home" type="button"><span class="si-icon">🚀</span><span class="si-label">Product board</span></button>
        </div>
      </section>

      <section class="side-group open">
        <button class="group-head" type="button"><span class="gh-icon">🔒</span><span>Private</span><i class="chev">▾</i></button>
        <div class="group-body">
          <button class="side-item" data-view="notes" type="button"><span class="si-icon">📝</span><span class="si-label">My notes</span></button>
        </div>
      </section>
    </nav>

    <footer class="sidebar-foot">
      <span id="user-email" class="foot-email"></span>
      <button id="logout-btn" class="btn-link small" type="button">Log out</button>
    </footer>
  </aside>

  <main class="main">
    <div id="verify-banner" class="verify-banner" hidden>
      <span>⚠️ Please verify your email — keep your account secure.</span>
      <button id="resend-verify-btn" class="btn-link" type="button">Resend email</button>
    </div>
    <header class="main-top">
      <button id="mobile-menu" class="btn-icon" type="button" aria-label="Toggle sidebar">☰</button>
      <nav class="breadcrumb"><span>Workspace</span><span class="crumb-sep">/</span><b id="crumb-page">Home · Product</b></nav>
      <div class="top-actions">
        <button id="search-toggle" class="btn-icon" type="button" title="Search tasks">🔍</button>
        <input id="board-search" class="board-search" placeholder="Filter tasks…" hidden>
        <button id="sort-btn" class="btn-icon" type="button" title="Sort: manual order">⇅</button>
        <div class="new-wrap">
          <button id="new-task-btn" class="btn btn-primary" type="button">New ▾</button>
          <div id="new-task-menu" class="menu" hidden>
            <button data-status="todo" type="button">To-do</button>
            <button data-status="doing" type="button">In progress</button>
            <button data-status="review" type="button">In review</button>
            <button data-status="done" type="button">Complete</button>
          </div>
        </div>
      </div>
    </header>

    <!-- HOME: kanban board -->
    <section id="view-home" class="view">
      <header class="page-head">
        <h1 class="page-title"><span class="page-icon">📋</span> Company tasks</h1>
        <div class="page-tabs">
          <button class="ptab active" data-board-tab="board" type="button">Board</button>
          <button class="ptab" data-board-tab="timeline" type="button">Timeline</button>
        </div>
      </header>

      <div id="board" class="board"></div>
      <div id="timeline" class="timeline" hidden></div>
    </section>

    <!-- NOTES: editor -->
    <section id="view-notes" class="view" hidden>
      <div class="notes-wrap">
        <div class="notes-side">
          <button id="new-note-btn" class="btn btn-primary btn-block" type="button">+ New note</button>
          <input type="search" id="search-input" class="search" placeholder="Search notes…" autocomplete="off">
          <nav id="note-list" class="note-list" aria-label="Notes"></nav>
        </div>
        <div class="notes-editor">
          <div id="editor-empty" class="editor-empty"><p>Select a note, or create one.</p></div>
          <div id="editor-pane" class="editor-pane" hidden>
            <header class="editor-toolbar">
              <span id="save-status" class="save-status"></span>
              <span class="toolbar-spacer"></span>
              <button id="mode-toggle" class="btn btn-ghost" type="button">Preview</button>
              <button id="delete-btn" class="btn btn-ghost danger" type="button">Delete</button>
            </header>
            <input id="note-title" class="note-title" placeholder="Untitled" maxlength="255" autocomplete="off">
            <div id="todo-progress" class="todo-progress" hidden></div>
            <textarea id="note-content" class="note-content" spellcheck="true" placeholder="Write something… Type '- [ ] your task' to start a to-do list."></textarea>
            <div id="note-preview" class="note-preview" hidden></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Add-event modal -->
  <div id="event-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="event-modal-title">
      <header class="modal-head">
        <h2 id="event-modal-title">Add event</h2>
        <button id="event-modal-close" class="btn-icon" type="button" title="Close">✕</button>
      </header>
      <form id="event-form">
        <label class="field">
          <span>Name</span>
          <input id="event-title" required maxlength="255" placeholder="Design review">
        </label>
        <label class="field">
          <span>Description</span>
          <textarea id="event-desc" rows="3" maxlength="2000" placeholder="Optional details…"></textarea>
        </label>
        <label class="field">
          <span>Date</span>
          <input id="event-date" type="date" required>
        </label>
        <p id="event-error" class="auth-error" hidden></p>
        <div class="modal-actions">
          <button type="button" id="event-cancel" class="btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Add event</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Floating ambient insight cards -->
  <div id="float-stack" class="float-stack" aria-live="polite"></div>
</div>

<script src="app.js?v=20260830d"></script>
</body>
</html>
